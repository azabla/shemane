# Development overlay. Not for production.
#   docker compose -f docker-compose.yml -f compose.dev.yaml up -d
# See docs/robit/DEVELOPMENT.md.
services:
  app:
    command:
      - sh
      - -c
      - '[ -f vendor/autoload.php ] || composer install --no-interaction; exec php artisan serve --host=0.0.0.0 --port=8000'
    environment:
      PHP_CLI_SERVER_WORKERS: '4'
      COMPOSER_HOME: /tmp/composer
    volumes:
      - ./:/var/www/html
      - ./.docker/dev/php.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro

  vite:
    image: node:26-alpine
    user: '${WWWUSER:-1000}:${WWWGROUP:-1000}'
    working_dir: /app
    command: sh -c '[ -d node_modules ] || npm ci; exec npm run dev'
    environment:
      VITE_DEV_SERVER: '1'
      VITE_DEV_ORIGIN: 'http://localhost:${VITE_PORT:-5173}'
      VITE_HMR_CLIENT_PORT: '${VITE_PORT:-5173}'
    ports:
      - '127.0.0.1:${VITE_PORT:-5173}:5173'
    volumes:
      - ./:/app
    networks:
      - appnet

  mysql:
    ports: !override
      - '127.0.0.1:${FORWARD_DB_PORT:-3306}:3306'

  redis:
    ports: !override
      - '127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379'

  mailpit:
    ports: !override
      - '127.0.0.1:${FORWARD_MAIL_PORT:-1025}:1025'
      - '127.0.0.1:${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
